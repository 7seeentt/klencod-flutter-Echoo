name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.example --project-name echo_fx .

      - name: Install native audio engine
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/echo_fx
          cp native/MainActivity.kt android/app/src/main/kotlin/com/example/echo_fx/MainActivity.kt

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'

          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace("<application", permission + "\n    <application", 1)

          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHO-FX-APK
          path: build/app/outputs/flutter-apk/app-release.apk